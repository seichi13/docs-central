site_name: "Docs — [Tu Empresa]"
site_description: "Portal de documentación técnica interna"
site_url: https://tu-org.github.io/docs-central
repo_url: https://github.com/tu-org/docs-central
repo_name: tu-org/docs-central
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Servicios:
      - servicios/index.md
      - "🔧 Nombre Servicio A": servicios/servicio-a.md
      - "🔧 Nombre Servicio B": servicios/servicio-b.md
      # Agrega aquí tus 23 servicios
  - Guías:
      - guias/onboarding.md
      - guias/como-crear-servicio.md
      - guias/estandares.md
  - Decisiones (ADR):
      - decisiones/index.md
      - decisiones/adr-001-template.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tu-org
